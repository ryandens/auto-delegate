name: "Validate"
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: write

jobs:
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Renovate updates the version and download-script commit together.
      - name: Download actionlint
        id: get_actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) "$ACTIONLINT_VERSION"
        shell: bash

      - name: Check workflow files
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash

  build:
    name: "Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 27

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          dependency-graph: generate-and-submit

      - name: Setup TestLens
        uses: testlens-app/setup-testlens@v1

      - name: Execute Gradle build
        run: ./gradlew build :build-logic:check --warning-mode fail

name: "Validate"
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: write

jobs:
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Renovate updates the version and download-script commit together.
      - name: Download actionlint
        id: get_actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) "$ACTIONLINT_VERSION"
        shell: bash

      - name: Check workflow files
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash

  build:
    name: "Validation"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 71b0835a2cf0dae3dee2ba85cddbbbaadc102bdd
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 27

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          dependency-graph: generate-and-submit

      - name: Setup TestLens
        uses: testlens-app/setup-testlens@v1
        with:
          use-oidc: true
          github-token: ''

      - name: Inspect restored processor test cache
        shell: python
        run: |
          import os
          import pathlib
          import tarfile
          root = pathlib.Path(os.environ.get("GRADLE_USER_HOME", pathlib.Path.home() / ".gradle"))
          for cache in root.glob("caches/build-cache-*"):
              if not cache.is_dir():
                  continue
              for entry in sorted(cache.iterdir()):
                  if not entry.is_file() or len(entry.name) != 32:
                      continue
                  try:
                      with tarfile.open(entry) as archive:
                          metadata = archive.extractfile("METADATA").read().decode()
                      if "auto-delegate-processor" in metadata and "test" in metadata:
                          fields = [line for line in metadata.splitlines() if line.startswith(("identity=", "buildCacheKey=", "buildInvocationId="))]
                          print(entry.name, *fields, sep="\n")
                  except (tarfile.TarError, KeyError, UnicodeError, OSError):
                      continue
          expected = root / "caches" / "build-cache-1" / "2d9acf90d4c8dea19fe2bc0bbd6e2e3a"
          print("Previous PR processor test key present:", expected.exists())

      - name: Install fingerprint observer
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/testlens-fingerprints.init.gradle" <<'STUDY_EOF'
          import org.gradle.internal.operations.*
          import org.gradle.api.internal.tasks.SnapshotTaskInputsBuildOperationType
          import org.gradle.api.internal.tasks.execution.ExecuteTaskBuildOperationType
          import groovy.json.JsonOutput
          import java.util.concurrent.ConcurrentHashMap
          
          gradle.services.get(BuildOperationListenerManager).addListener(new BuildOperationListener() {
              final Map paths = new ConcurrentHashMap()
              void started(BuildOperationDescriptor operation, OperationStartEvent event) {
                  def path = operation.details instanceof ExecuteTaskBuildOperationType.Details ? operation.details.taskPath : (operation.parentId == null ? null : paths.get(operation.parentId))
                  if (path != null) paths.put(operation.id, path)
              }
              void progress(OperationIdentifier id, OperationProgressEvent event) {}
              void finished(BuildOperationDescriptor operation, OperationFinishEvent event) {
                  def path = paths.remove(operation.id)
                  def r = event.result
                  if (path == ':auto-delegate-processor:test' && r instanceof SnapshotTaskInputsBuildOperationType.Result) {
                      def files = [:]
                      def noop = { Object state -> }
                      r.visitInputFileProperties([
                          preProperty: { state -> files[state.propertyName] = state.propertyHashBytes?.encodeHex()?.toString() },
                          preRoot: noop, preDirectory: noop, file: noop,
                          postDirectory: {}, postRoot: {}, postProperty: {}
                      ] as SnapshotTaskInputsBuildOperationType.Result.InputFilePropertyVisitor)
                      println 'STUDY_FINGERPRINT ' + JsonOutput.toJson([
                          key: r.hashBytes?.encodeHex()?.toString(),
                          classLoader: r.classLoaderHashBytes?.encodeHex()?.toString(),
                          actionClasses: r.actionClassNames,
                          actionClassLoaders: r.actionClassLoaderHashesBytes?.collect { it?.encodeHex()?.toString() },
                          values: r.inputValueHashesBytes?.collectEntries { k, v -> [(k): v?.encodeHex()?.toString()] },
                          files: files,
                          outputs: r.outputPropertyNames
                      ])
                  }
              }
          })
          STUDY_EOF

      - name: Execute Gradle build
        run: ./gradlew build :build-logic:check --warning-mode fail --init-script "$RUNNER_TEMP/testlens-fingerprints.init.gradle"

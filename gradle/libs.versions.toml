[versions]
auto-service = "1.1.1"
junit = "6.1.3"
spotless = "8.10.4"

[libraries]
nebula-contacts-plugin = { module = "com.netflix.nebula:gradle-contacts-plugin", version = "8.0.0" }
auto-common = { module = "com.google.auto:auto-common", version = "1.2.2" }
auto-service = { module = "com.google.auto.service:auto-service", version.ref = "auto-service" }
auto-service-annotations = { module = "com.google.auto.service:auto-service-annotations", version.ref = "auto-service" }
javapoet = { module = "com.squareup:javapoet", version = "1.13.0" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-core = { module = "org.mockito:mockito-core", version = "5.24.0" }
nebula-publish-plugin = { module = "com.netflix.nebula.maven-nebula-publish:com.netflix.nebula.maven-nebula-publish.gradle.plugin", version = "23.1.0" }
nebula-info-plugin = { module = "com.netflix.nebula.info:com.netflix.nebula.info.gradle.plugin", version = "16.3.0" }
spotless-plugin = { module = "com.diffplug.spotless:com.diffplug.spotless.gradle.plugin", version.ref = "spotless" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
nexus-publish = { id = "io.github.gradle-nexus.publish-plugin", version = "2.0.0" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
javaagent-test = { id = "com.ryandens.javaagent-test", version = "0.12.2" }
